[package]
name = "mimi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mimi-types = { path = "../mimi-types", features = ["user"] }

# Its own workspace: cargo-fuzz builds with special flags, kept out of the main tree.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
